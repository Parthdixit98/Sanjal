<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Particle Photos — Gesture Gallery</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1632090706/camera_utils.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    color: #0ff;
  }

  #main-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
  }

  #video-feed {
    position: fixed;
    bottom: 16px; right: 16px;
    width: 200px; height: 150px;
    border: 1px solid rgba(0,255,255,0.3);
    border-radius: 4px;
    z-index: 10;
    transform: scaleX(-1);
    opacity: 0.8;
  }

  #hand-canvas {
    position: fixed;
    bottom: 16px; right: 16px;
    width: 200px; height: 150px;
    border-radius: 4px;
    z-index: 11;
    transform: scaleX(-1);
    pointer-events: none;
  }

  #ui-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  #title {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(0,255,255,0.5);
    text-transform: uppercase;
    z-index: 12;
  }

  #finger-display {
    position: fixed;
    top: 50%; left: 30px;
    transform: translateY(-50%);
    z-index: 12;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .finger-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(0,255,255,0.3);
    transition: color 0.3s;
  }

  .finger-item.active {
    color: rgba(0,255,255,1);
  }

  .finger-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(0,255,255,0.3);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .finger-item.active .finger-dot {
    background: #0ff;
    box-shadow: 0 0 8px #0ff;
  }

  #status {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(0,255,255,0.4);
    z-index: 12;
    text-transform: uppercase;
  }

  #upload-ui {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    background: rgba(0,0,0,0.95);
    border: 1px solid rgba(0,255,255,0.3);
    padding: 40px;
    text-align: center;
    max-width: 500px;
    width: 90%;
  }

  #upload-ui h2 {
    font-size: 12px;
    letter-spacing: 6px;
    color: #0ff;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  #upload-ui p {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(0,255,255,0.5);
    margin-bottom: 30px;
    line-height: 1.8;
  }

  .photo-slots {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }

  .photo-slot {
    aspect-ratio: 1;
    border: 1px dashed rgba(0,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: rgba(0,255,255,0.4);
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .photo-slot:hover { border-color: rgba(0,255,255,0.8); }
  .photo-slot.loaded { border-color: rgba(0,255,255,0.6); }

  .photo-slot img {
    width: 100%; height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0; left: 0;
  }

  .slot-label {
    position: absolute;
    bottom: 2px; left: 0; right: 0;
    text-align: center;
    font-size: 8px;
    letter-spacing: 1px;
    background: rgba(0,0,0,0.7);
    padding: 2px;
    color: #0ff;
  }

  .input-hidden { display: none; }

  #start-btn {
    background: transparent;
    border: 1px solid #0ff;
    color: #0ff;
    padding: 12px 40px;
    font-size: 10px;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    transition: background 0.2s;
  }

  #start-btn:hover { background: rgba(0,255,255,0.1); }
  #start-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #loading-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    flex-direction: column;
    gap: 16px;
  }

  #loading-screen p {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(0,255,255,0.6);
    text-transform: uppercase;
  }

  .loader {
    width: 40px; height: 40px;
    border: 1px solid rgba(0,255,255,0.2);
    border-top-color: #0ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #photo-label {
    position: fixed;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 5px;
    color: rgba(0,255,255,0.7);
    z-index: 12;
    text-transform: uppercase;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>

<!-- Upload UI -->
<div id="upload-ui">
  <h2>GPU Particle Gallery</h2>
  <p>Upload 5 photos. Show 1–5 fingers to the camera<br>and watch each photo emerge from particles.</p>
  <div class="photo-slots">
    <div class="photo-slot" id="slot-0" onclick="triggerUpload(0)">
      <span>☝</span>
      <div class="slot-label">1 FINGER</div>
    </div>
    <div class="photo-slot" id="slot-1" onclick="triggerUpload(1)">
      <span>✌</span>
      <div class="slot-label">2 FINGERS</div>
    </div>
    <div class="photo-slot" id="slot-2" onclick="triggerUpload(2)">
      <span>🤟</span>
      <div class="slot-label">3 FINGERS</div>
    </div>
    <div class="photo-slot" id="slot-3" onclick="triggerUpload(3)">
      <span>🖖</span>
      <div class="slot-label">4 FINGERS</div>
    </div>
    <div class="photo-slot" id="slot-4" onclick="triggerUpload(4)">
      <span>🖐</span>
      <div class="slot-label">5 FINGERS</div>
    </div>
  </div>
  <input type="file" class="input-hidden" id="file-input-0" accept="image/*" onchange="loadPhoto(0, this)">
  <input type="file" class="input-hidden" id="file-input-1" accept="image/*" onchange="loadPhoto(1, this)">
  <input type="file" class="input-hidden" id="file-input-2" accept="image/*" onchange="loadPhoto(2, this)">
  <input type="file" class="input-hidden" id="file-input-3" accept="image/*" onchange="loadPhoto(3, this)">
  <input type="file" class="input-hidden" id="file-input-4" accept="image/*" onchange="loadPhoto(4, this)">
  <button id="start-btn" onclick="startExperience()" disabled>START — ENABLE CAMERA</button>
</div>

<!-- Loading -->
<div id="loading-screen" style="display:none">
  <div class="loader"></div>
  <p id="loading-text">Initializing hand tracking...</p>
</div>

<!-- Main Experience -->
<canvas id="main-canvas" style="display:none"></canvas>
<video id="video-feed" autoplay playsinline muted style="display:none"></video>
<canvas id="hand-canvas" style="display:none"></canvas>

<div id="title" style="display:none">GPU PARTICLE PHOTOS</div>
<div id="photo-label" style="display:none; opacity:0"></div>

<div id="finger-display" style="display:none">
  <div class="finger-item" id="fi-1"><div class="finger-dot"></div>1 FINGER</div>
  <div class="finger-item" id="fi-2"><div class="finger-dot"></div>2 FINGERS</div>
  <div class="finger-item" id="fi-3"><div class="finger-dot"></div>3 FINGERS</div>
  <div class="finger-item" id="fi-4"><div class="finger-dot"></div>4 FINGERS</div>
  <div class="finger-item" id="fi-5"><div class="finger-dot"></div>5 FINGERS</div>
</div>

<div id="status" style="display:none">SHOW FINGERS TO CAMERA</div>

<script>
// ============================================================
// PHOTO MANAGEMENT
// ============================================================
const photoData = [null, null, null, null, null];
const photoLabels = ['Photo 1', 'Photo 2', 'Photo 3', 'Photo 4', 'Photo 5'];
let photosCount = 0;

function triggerUpload(idx) {
  document.getElementById('file-input-' + idx).click();
}

function loadPhoto(idx, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    photoData[idx] = e.target.result;
    const slot = document.getElementById('slot-' + idx);
    slot.innerHTML = '';
    const img = document.createElement('img');
    img.src = e.target.result;
    slot.appendChild(img);
    const lbl = document.createElement('div');
    lbl.className = 'slot-label';
    lbl.textContent = (idx+1) + ' FINGER' + (idx > 0 ? 'S' : '');
    slot.appendChild(lbl);
    slot.classList.add('loaded');

    photosCount = photoData.filter(Boolean).length;
    if (photosCount >= 1) {
      document.getElementById('start-btn').disabled = false;
      document.getElementById('start-btn').textContent = 'START — ' + photosCount + '/5 PHOTOS LOADED';
    }
  };
  reader.readAsDataURL(file);
}

// ============================================================
// WEBGL GPU PARTICLE SYSTEM
// ============================================================

let gl, canvas, program, transformProgram;
let posBuffer, velBuffer, targetBuffer, colorBuffer;
let posBuffer2, velBuffer2;
let vao1, vao2;
let NUM_PARTICLES = 300000;

// State
let currentPhoto = -1;
let targetPhoto = -1;
let transitionProgress = 0;
let isTransitioning = false;
const TRANSITION_SPEED = 0.012;

// Photo textures
const photoTextures = [null, null, null, null, null];
const photoImages = [null, null, null, null, null];

// Vertex shader for rendering particles
const RENDER_VS = `#version 300 es
precision highp float;

in vec2 aPos;
in vec4 aColor;

uniform vec2 uResolution;
uniform float uPointSize;

out vec4 vColor;

void main() {
  vec2 clip = (aPos / uResolution) * 2.0 - 1.0;
  clip.y = -clip.y;
  gl_Position = vec4(clip, 0.0, 1.0);
  gl_PointSize = uPointSize;
  vColor = aColor;
}
`;

const RENDER_FS = `#version 300 es
precision highp float;

in vec4 vColor;
out vec4 fragColor;

void main() {
  vec2 c = gl_PointCoord - 0.5;
  float d = dot(c, c);
  if (d > 0.25) discard;
  float alpha = (0.25 - d) * 4.0;
  fragColor = vec4(vColor.rgb, vColor.a * alpha);
}
`;

// Transform feedback shader — GPU physics
const TRANSFORM_VS = `#version 300 es
precision highp float;

in vec2 aPos;
in vec2 aVel;
in vec2 aTarget;
in vec4 aColor;

uniform float uTime;
uniform float uTransition; // 0 = scatter, 1 = formed
uniform sampler2D uPhotoTex;
uniform vec2 uResolution;
uniform vec2 uPhotoSize;
uniform vec2 uPhotoOffset;
uniform float uRandSeed;

out vec2 vPos;
out vec2 vVel;
out vec2 vTarget;
out vec4 vColor;

// pseudo random
float rand(vec2 co) {
  return fract(sin(dot(co, vec2(12.9898,78.233) + uRandSeed)) * 43758.5453);
}

void main() {
  vec2 pos = aPos;
  vec2 vel = aVel;
  vec2 target = aTarget;
  vec4 color = aColor;

  // Attraction towards target
  float attractStrength = uTransition * 0.12;
  vec2 diff = target - pos;
  float dist = length(diff);

  // Spring force
  vec2 force = diff * attractStrength;

  // Turbulence when scattered
  float turb = (1.0 - uTransition) * 2.5;
  float t = uTime * 0.0003;
  float angle = rand(pos * 0.01 + t) * 6.28318;
  force += vec2(cos(angle), sin(angle)) * turb;

  // Damping
  float damping = 0.88 + uTransition * 0.07;
  vel = (vel + force) * damping;

  pos += vel;

  // Wrap particles within screen bounds (with margin)
  float margin = 50.0;
  if (pos.x < -margin) pos.x = uResolution.x + margin;
  if (pos.x > uResolution.x + margin) pos.x = -margin;
  if (pos.y < -margin) pos.y = uResolution.y + margin;
  if (pos.y > uResolution.y + margin) pos.y = -margin;

  // Color: sample photo at target UV
  vec2 photoUV = (target - uPhotoOffset) / uPhotoSize;
  photoUV = clamp(photoUV, 0.0, 1.0);
  vec4 photoColor = texture(uPhotoTex, photoUV);

  // Blend between nebula cyan and photo color based on transition
  vec3 nebulaColor = vec3(
    rand(pos * 0.001 + 1.0) * 0.3,
    0.7 + rand(pos * 0.001 + 2.0) * 0.3,
    0.9 + rand(pos * 0.001 + 3.0) * 0.1
  );

  color.rgb = mix(nebulaColor, photoColor.rgb, uTransition * photoColor.a);
  color.a = mix(0.3 + rand(pos * 0.01) * 0.4, photoColor.a * 0.85 + 0.15, uTransition);

  vPos = pos;
  vVel = vel;
  vTarget = target;
  vColor = color;
}
`;

const TRANSFORM_FS = `#version 300 es
precision highp float;
out vec4 fragColor;
void main() { fragColor = vec4(0.0); }
`;

function createShader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function createProgram(gl, vs, fs, tfVaryings) {
  const p = gl.createProgram();
  gl.attachShader(p, createShader(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, createShader(gl, gl.FRAGMENT_SHADER, fs));
  if (tfVaryings) gl.transformFeedbackVaryings(p, tfVaryings, gl.INTERLEAVED_ATTRIBS);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

function initWebGL() {
  canvas = document.getElementById('main-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { alert('WebGL2 not supported!'); return false; }

  // Check transform feedback
  const ext = gl.getExtension('EXT_color_buffer_float');

  program = createProgram(gl, RENDER_VS, RENDER_FS);
  transformProgram = createProgram(gl, TRANSFORM_VS, TRANSFORM_FS,
    ['vPos', 'vVel', 'vTarget', 'vColor']);

  return true;
}

function initParticles(photoIdx) {
  const W = canvas.width, H = canvas.height;

  // Calculate photo display size (contain)
  const img = photoImages[photoIdx];
  let pw, ph, px, py;
  if (img) {
    const ar = img.width / img.height;
    const canvasAr = W / H;
    if (ar > canvasAr) {
      pw = W * 0.85; ph = pw / ar;
    } else {
      ph = H * 0.85; pw = ph * ar;
    }
    px = (W - pw) / 2;
    py = (H - ph) / 2;
  } else {
    pw = W * 0.6; ph = H * 0.6;
    px = (W - pw) / 2; py = (H - ph) / 2;
  }

  const positions = new Float32Array(NUM_PARTICLES * 2);
  const velocities = new Float32Array(NUM_PARTICLES * 2);
  const targets = new Float32Array(NUM_PARTICLES * 2);
  const colors = new Float32Array(NUM_PARTICLES * 4);

  for (let i = 0; i < NUM_PARTICLES; i++) {
    // Random screen position
    positions[i*2]   = Math.random() * W;
    positions[i*2+1] = Math.random() * H;

    velocities[i*2]   = (Math.random() - 0.5) * 2;
    velocities[i*2+1] = (Math.random() - 0.5) * 2;

    // Sample target from photo
    const u = Math.random();
    const v = Math.random();
    targets[i*2]   = px + u * pw;
    targets[i*2+1] = py + v * ph;

    colors[i*4]   = 0;
    colors[i*4+1] = 0.8;
    colors[i*4+2] = 1.0;
    colors[i*4+3] = 0.5;
  }

  // Store photo dimensions for shader
  gl._photoInfo = { pw, ph, px, py };

  // Create interleaved buffer: pos(2) + vel(2) + target(2) + color(4) = 10 floats per particle
  const stride = 10;
  const interleaved1 = new Float32Array(NUM_PARTICLES * stride);
  const interleaved2 = new Float32Array(NUM_PARTICLES * stride);

  for (let i = 0; i < NUM_PARTICLES; i++) {
    const base = i * stride;
    interleaved1[base+0] = positions[i*2];
    interleaved1[base+1] = positions[i*2+1];
    interleaved1[base+2] = velocities[i*2];
    interleaved1[base+3] = velocities[i*2+1];
    interleaved1[base+4] = targets[i*2];
    interleaved1[base+5] = targets[i*2+1];
    interleaved1[base+6] = colors[i*4];
    interleaved1[base+7] = colors[i*4+1];
    interleaved1[base+8] = colors[i*4+2];
    interleaved1[base+9] = colors[i*4+3];
    // Copy to buffer2
    for (let j = 0; j < stride; j++) interleaved2[base+j] = interleaved1[base+j];
  }

  if (posBuffer) { gl.deleteBuffer(posBuffer); gl.deleteBuffer(posBuffer2); }

  posBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, interleaved1, gl.DYNAMIC_COPY);

  posBuffer2 = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer2);
  gl.bufferData(gl.ARRAY_BUFFER, interleaved2, gl.DYNAMIC_COPY);

  gl.bindBuffer(gl.ARRAY_BUFFER, null);
}

function updateTargets(photoIdx) {
  const W = canvas.width, H = canvas.height;
  const img = photoImages[photoIdx];
  let pw, ph, px, py;
  if (img) {
    const ar = img.width / img.height;
    const canvasAr = W / H;
    if (ar > canvasAr) { pw = W * 0.85; ph = pw / ar; }
    else { ph = H * 0.85; pw = ph * ar; }
    px = (W - pw) / 2; py = (H - ph) / 2;
  } else {
    pw = W * 0.6; ph = H * 0.6;
    px = (W - pw) / 2; py = (H - ph) / 2;
  }
  gl._photoInfo = { pw, ph, px, py };

  // Update targets in the current buffer
  const stride = 10;
  const data = new Float32Array(NUM_PARTICLES * stride);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.getBufferSubData(gl.ARRAY_BUFFER, 0, data);
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const u = Math.random();
    const v = Math.random();
    data[i*stride+4] = px + u * pw;
    data[i*stride+5] = py + v * ph;
  }
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer2);
  gl.getBufferSubData(gl.ARRAY_BUFFER, 0, data);
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const u = Math.random();
    const v = Math.random();
    data[i*stride+4] = px + u * pw;
    data[i*stride+5] = py + v * ph;
  }
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
}

function loadPhotoTexture(idx) {
  return new Promise(resolve => {
    if (!photoData[idx]) { resolve(); return; }
    const img = new Image();
    img.onload = () => {
      photoImages[idx] = img;
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      photoTextures[idx] = tex;
      resolve();
    };
    img.src = photoData[idx];
  });
}

// Create a dummy 1x1 white texture as fallback
function createDummyTexture() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
    new Uint8Array([255, 200, 180, 255]));
  return tex;
}

let currentBuf = 0;
let tfObj;
let frameCount = 0;
let randSeed = 0;

function render(time) {
  requestAnimationFrame(render);

  const W = canvas.width, H = canvas.height;

  // Handle transition
  if (isTransitioning) {
    transitionProgress += TRANSITION_SPEED;
    if (transitionProgress >= 1) {
      transitionProgress = 1;
      isTransitioning = false;
      currentPhoto = targetPhoto;
    }
  }

  const readBuf  = currentBuf === 0 ? posBuffer  : posBuffer2;
  const writeBuf = currentBuf === 0 ? posBuffer2 : posBuffer;

  // TRANSFORM FEEDBACK PASS
  gl.useProgram(transformProgram);

  const loc = {
    aPos:    gl.getAttribLocation(transformProgram, 'aPos'),
    aVel:    gl.getAttribLocation(transformProgram, 'aVel'),
    aTarget: gl.getAttribLocation(transformProgram, 'aTarget'),
    aColor:  gl.getAttribLocation(transformProgram, 'aColor'),
    uTime:      gl.getUniformLocation(transformProgram, 'uTime'),
    uTransition:gl.getUniformLocation(transformProgram, 'uTransition'),
    uPhotoTex:  gl.getUniformLocation(transformProgram, 'uPhotoTex'),
    uResolution:gl.getUniformLocation(transformProgram, 'uResolution'),
    uPhotoSize: gl.getUniformLocation(transformProgram, 'uPhotoSize'),
    uPhotoOffset:gl.getUniformLocation(transformProgram, 'uPhotoOffset'),
    uRandSeed:  gl.getUniformLocation(transformProgram, 'uRandSeed'),
  };

  const BYTES = 4;
  const STRIDE = 10 * BYTES;

  gl.bindBuffer(gl.ARRAY_BUFFER, readBuf);
  gl.enableVertexAttribArray(loc.aPos);
  gl.vertexAttribPointer(loc.aPos, 2, gl.FLOAT, false, STRIDE, 0);
  gl.enableVertexAttribArray(loc.aVel);
  gl.vertexAttribPointer(loc.aVel, 2, gl.FLOAT, false, STRIDE, 2*BYTES);
  gl.enableVertexAttribArray(loc.aTarget);
  gl.vertexAttribPointer(loc.aTarget, 2, gl.FLOAT, false, STRIDE, 4*BYTES);
  gl.enableVertexAttribArray(loc.aColor);
  gl.vertexAttribPointer(loc.aColor, 4, gl.FLOAT, false, STRIDE, 6*BYTES);

  gl.uniform1f(loc.uTime, time);
  gl.uniform1f(loc.uTransition, transitionProgress);
  gl.uniform2f(loc.uResolution, W, H);
  gl.uniform1f(loc.uRandSeed, randSeed);

  const pi = gl._photoInfo || { pw: W*0.6, ph: H*0.6, px: W*0.2, py: H*0.2 };
  gl.uniform2f(loc.uPhotoSize, pi.pw, pi.ph);
  gl.uniform2f(loc.uPhotoOffset, pi.px, pi.py);

  // Bind texture
  gl.activeTexture(gl.TEXTURE0);
  const photoIdx = targetPhoto >= 0 ? targetPhoto : 0;
  const tex = (photoTextures[photoIdx] || dummyTex);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(loc.uPhotoTex, 0);

  // Run transform feedback
  if (!tfObj) tfObj = gl.createTransformFeedback();
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObj);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, writeBuf);

  gl.enable(gl.RASTERIZER_DISCARD);
  gl.beginTransformFeedback(gl.POINTS);
  gl.drawArrays(gl.POINTS, 0, NUM_PARTICLES);
  gl.endTransformFeedback();
  gl.disable(gl.RASTERIZER_DISCARD);

  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);

  // RENDER PASS
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  gl.useProgram(program);

  const rloc = {
    aPos:   gl.getAttribLocation(program, 'aPos'),
    aColor: gl.getAttribLocation(program, 'aColor'),
    uResolution: gl.getUniformLocation(program, 'uResolution'),
    uPointSize:  gl.getUniformLocation(program, 'uPointSize'),
  };

  gl.bindBuffer(gl.ARRAY_BUFFER, writeBuf);
  gl.enableVertexAttribArray(rloc.aPos);
  gl.vertexAttribPointer(rloc.aPos, 2, gl.FLOAT, false, STRIDE, 0);
  gl.enableVertexAttribArray(rloc.aColor);
  gl.vertexAttribPointer(rloc.aColor, 4, gl.FLOAT, false, STRIDE, 6*BYTES);

  gl.uniform2f(rloc.uResolution, W, H);
  // Point size: larger when formed, smaller when scattered
  const ptSize = 1.2 + transitionProgress * 0.8;
  gl.uniform1f(rloc.uPointSize, ptSize);

  gl.drawArrays(gl.POINTS, 0, NUM_PARTICLES);
  gl.disable(gl.BLEND);

  // Swap buffers
  currentBuf = 1 - currentBuf;
  frameCount++;
  if (frameCount % 180 === 0) randSeed = Math.random() * 1000;
}

// ============================================================
// HAND TRACKING
// ============================================================

let dummyTex;

async function startExperience() {
  document.getElementById('upload-ui').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';

  // Init WebGL
  if (!initWebGL()) return;
  dummyTex = createDummyTexture();

  document.getElementById('loading-text').textContent = 'Loading photo textures...';
  for (let i = 0; i < 5; i++) {
    if (photoData[i]) await loadPhotoTexture(i);
  }

  // Start with first available photo
  const firstPhoto = photoData.findIndex(Boolean);
  if (firstPhoto >= 0) {
    targetPhoto = firstPhoto;
    transitionProgress = 0;
  } else {
    targetPhoto = 0;
    transitionProgress = 0;
  }

  initParticles(Math.max(0, firstPhoto));

  document.getElementById('loading-text').textContent = 'Starting camera...';

  const video = document.getElementById('video-feed');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
  } catch(e) {
    alert('Camera access required! ' + e.message);
    return;
  }

  document.getElementById('loading-text').textContent = 'Loading hand tracking model...';

  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}` });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7,
  });

  const handCanvas = document.getElementById('hand-canvas');
  const hCtx = handCanvas.getContext('2d');
  handCanvas.width = 200;
  handCanvas.height = 150;

  let lastFingers = -1;
  let fingerStableCount = 0;
  const STABLE_FRAMES = 8;

  hands.onResults(results => {
    hCtx.clearRect(0, 0, 200, 150);

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      const fingers = countFingers(lm);

      // Draw hand skeleton
      drawHandOnMini(hCtx, lm, 200, 150);

      // Show finger count
      hCtx.fillStyle = '#0ff';
      hCtx.font = 'bold 14px Courier New';
      hCtx.fillText(fingers + ' finger' + (fingers !== 1 ? 's' : ''), 8, 20);

      if (fingers === lastFingers) {
        fingerStableCount++;
      } else {
        fingerStableCount = 0;
        lastFingers = fingers;
      }

      if (fingerStableCount === STABLE_FRAMES && fingers >= 1 && fingers <= 5) {
        const photoIdx = fingers - 1;
        if (photoIdx !== targetPhoto && photoData[photoIdx]) {
          switchToPhoto(photoIdx);
        }
        // Update UI
        for (let i = 1; i <= 5; i++) {
          const el = document.getElementById('fi-' + i);
          el.classList.toggle('active', i === fingers);
        }
      }
    } else {
      hCtx.fillStyle = 'rgba(0,255,255,0.3)';
      hCtx.font = '10px Courier New';
      hCtx.fillText('No hand', 8, 20);
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640, height: 480
  });
  await camera.start();

  // Show main UI
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('main-canvas').style.display = 'block';
  document.getElementById('video-feed').style.display = 'block';
  document.getElementById('hand-canvas').style.display = 'block';
  document.getElementById('title').style.display = 'block';
  document.getElementById('finger-display').style.display = 'flex';
  document.getElementById('status').style.display = 'block';
  document.getElementById('photo-label').style.display = 'block';

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  requestAnimationFrame(render);

  // Scatter first, then form
  setTimeout(() => {
    isTransitioning = true;
    transitionProgress = 0;
  }, 500);
}

function switchToPhoto(idx) {
  targetPhoto = idx;
  transitionProgress = 0;
  isTransitioning = true;

  updateTargets(idx);

  const labelEl = document.getElementById('photo-label');
  labelEl.textContent = 'PHOTO ' + (idx + 1);
  labelEl.style.opacity = 1;
  setTimeout(() => labelEl.style.opacity = 0, 2000);
}

function countFingers(lm) {
  // Tip landmark indices: thumb=4, index=8, middle=12, ring=16, pinky=20
  // MCP (base) indices: thumb=2, index=5, middle=9, ring=13, pinky=17
  const tips = [4, 8, 12, 16, 20];
  const mids = [3, 6, 10, 14, 18];
  let count = 0;

  // Thumb: compare x position
  if (lm[4].x < lm[3].x) count++; // mirrored camera

  // Other fingers: tip above mid (y axis inverted)
  for (let i = 1; i < 5; i++) {
    if (lm[tips[i]].y < lm[mids[i]].y) count++;
  }

  return count;
}

function drawHandOnMini(ctx, lm, w, h) {
  const connections = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];

  ctx.strokeStyle = 'rgba(0,255,255,0.5)';
  ctx.lineWidth = 1;
  for (const [a, b] of connections) {
    ctx.beginPath();
    ctx.moveTo(lm[a].x * w, lm[a].y * h);
    ctx.lineTo(lm[b].x * w, lm[b].y * h);
    ctx.stroke();
  }

  ctx.fillStyle = '#0ff';
  for (const p of lm) {
    ctx.beginPath();
    ctx.arc(p.x * w, p.y * h, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}
