<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GPU Finger Controlled Particle Portrait</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}

#cameraBox{
    position:fixed;
    bottom:20px;
    right:20px;
    width:220px;
    height:160px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 20px cyan;
    z-index:10;
}
#output_canvas{
    width:100%;
    height:100%;
}

#messageContainer{
    position:fixed;
    top:50%;
    left:60px;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:20px;
    opacity:0;
    transition:opacity 0.4s ease;
}

#messageText{
    color:white;
    font-size:42px;
    font-weight:bold;
    text-shadow:0 0 20px cyan;
    max-width:400px;
}

#arrow{
    font-size:60px;
    color:cyan;
    animation:arrowMove 1s infinite alternate;
}

@keyframes arrowMove{
    from{ transform:translateX(0px); }
    to{ transform:translateX(15px); }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>

<div id="messageContainer">
    <div id="messageText"></div>
    <div id="arrow">➜</div>
</div>

<div id="cameraBox">
    <canvas id="output_canvas"></canvas>
</div>

<script>

//////////////////// GPU PARTICLES ////////////////////

const COUNT = 200000;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    5000
);
camera.position.z = 900;

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.debug.checkShaderErrors = true;
document.body.appendChild(renderer.domElement);

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

//////////////////// GEOMETRY ////////////////////

const geometry = new THREE.BufferGeometry();

const positions = new Float32Array(COUNT * 3);
const targets   = new Float32Array(COUNT * 3);
const colors    = new Float32Array(COUNT * 3);

for(let i=0;i<COUNT;i++){
    const x = (Math.random()-0.5)*2000;
    const y = (Math.random()-0.5)*2000;

    positions[i*3]   = x;
    positions[i*3+1] = y;
    positions[i*3+2] = 0;

    targets[i*3]   = x;
    targets[i*3+1] = y;
    targets[i*3+2] = 0;

    colors[i*3] = 1;
    colors[i*3+1] = 1;
    colors[i*3+2] = 1;
}

geometry.setAttribute("position", new THREE.BufferAttribute(positions,3));
geometry.setAttribute("aTarget", new THREE.BufferAttribute(targets,3));
geometry.setAttribute("color", new THREE.BufferAttribute(colors,3));

//////////////////// SHADER ////////////////////

const material = new THREE.ShaderMaterial({

    uniforms:{
        uProgress:{ value:0 }
    },

    vertexShader:`
        attribute vec3 aTarget;
        attribute vec3 color;

        uniform float uProgress;

        varying vec3 vColor;

        void main(){
            vec3 newPos = mix(position, aTarget, uProgress);
            vColor = color;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos,1.0);
            gl_PointSize = 1.3;
        }
    `,

    fragmentShader:`
        varying vec3 vColor;

        void main(){
            float d = length(gl_PointCoord - vec2(0.5));
            if(d > 0.5) discard;
            gl_FragColor = vec4(vColor,1.0);
        }
    `,

    vertexColors:true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

//////////////////// IMAGE LOADING ////////////////////

const imagePaths = ["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg"];
const imageData = [];

imagePaths.forEach((path,i)=>{
    const img = new Image();
    img.src = path;

    img.onload = ()=>{
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img,0,0);
        imageData[i] = ctx.getImageData(0,0,img.width,img.height);
    };
});

//////////////////// TARGET FUNCTIONS ////////////////////

function randomSpace(){
    const arr = geometry.attributes.aTarget.array;

    for(let i=0;i<COUNT;i++){
        arr[i*3]   = (Math.random()-0.5)*2500;
        arr[i*3+1] = (Math.random()-0.5)*2500;
        arr[i*3+2] = 0;
    }

    geometry.attributes.aTarget.needsUpdate = true;
    material.uniforms.uProgress.value = 0;
}

function updateToImage(index){

    if(!imageData[index]) return;

    const img = imageData[index];
    const data = img.data;
    const w = img.width;
    const h = img.height;

    const arr = geometry.attributes.aTarget.array;
    const col = geometry.attributes.color.array;

    const scale = 1.5;

    for(let i=0;i<COUNT;i++){
        const px = Math.floor(Math.random()*w);
        const py = Math.floor(Math.random()*h);

        const id = (py*w + px)*4;

        arr[i*3]   = (px - w/2)*scale;
        arr[i*3+1] = (h/2 - py)*scale;
        arr[i*3+2] = 0;

        col[i*3]   = data[id]/255;
        col[i*3+1] = data[id+1]/255;
        col[i*3+2] = data[id+2]/255;
    }

    geometry.attributes.aTarget.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;
    material.uniforms.uProgress.value = 0;
}

//////////////////// ANIMATION ////////////////////

function animate(){
    requestAnimationFrame(animate);

    material.uniforms.uProgress.value += 0.02;
    if(material.uniforms.uProgress.value > 1)
        material.uniforms.uProgress.value = 1;

    renderer.render(scene,camera);
}
animate();

//////////////////// HAND TRACKING ////////////////////

const videoElement = document.createElement("video");
const canvasElement = document.getElementById("output_canvas");
const canvasCtx = canvasElement.getContext("2d");

canvasElement.width = 220;
canvasElement.height = 160;

let lastFinger = -1;

const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.7
});

hands.onResults(results=>{

    canvasCtx.clearRect(0,0,canvasElement.width,canvasElement.height);
    canvasCtx.drawImage(results.image,0,0,canvasElement.width,canvasElement.height);

    let fingers = 0;

    if(results.multiHandLandmarks){
        const lm = results.multiHandLandmarks[0];

        drawConnectors(canvasCtx,lm,HAND_CONNECTIONS,{color:'#00FFFF'});
        drawLandmarks(canvasCtx,lm,{color:'#FFFFFF'});

        if(lm[8].y < lm[6].y) fingers++;
        if(lm[12].y < lm[10].y) fingers++;
        if(lm[16].y < lm[14].y) fingers++;
        if(lm[20].y < lm[18].y) fingers++;
        if(lm[4].x < lm[3].x) fingers++;
    }

    if(fingers !== lastFinger){
        lastFinger = fingers;

        if(fingers===0) randomSpace();
        else if(fingers===1) updateToImage(0);
        else if(fingers===2) updateToImage(1);
        else if(fingers===3) updateToImage(2);
        else if(fingers===4) updateToImage(3);
        else if(fingers===5) updateToImage(4);
    }

});

const cameraMP = new Camera(videoElement,{
    onFrame: async()=>{ await hands.send({image:videoElement}); },
    width:640,
    height:480
});
cameraMP.start();

</script>
</body>
</html>
