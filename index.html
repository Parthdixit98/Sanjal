<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GPU Particle Fixed</title>

<style>
body{margin:0;overflow:hidden;background:black;}

#cameraBox{
position:fixed;bottom:20px;right:20px;
width:220px;height:160px;border-radius:15px;
overflow:hidden;box-shadow:0 0 20px cyan;
}
#output_canvas{width:100%;height:100%;}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>

<div id="cameraBox">
<canvas id="output_canvas"></canvas>
</div>

<script>

//////////////////// SCENE ////////////////////

const COUNT = 150000;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,5000);
camera.position.z = 900;

const renderer = new THREE.WebGLRenderer({powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.debug.checkShaderErrors = true;
document.body.appendChild(renderer.domElement);

//////////////////// PARTICLES ////////////////////

const geo = new THREE.BufferGeometry();

const pos = new Float32Array(COUNT*3);
const target = new Float32Array(COUNT*3);
const color = new Float32Array(COUNT*3);

for(let i=0;i<COUNT;i++){
    let x=(Math.random()-0.5)*2000;
    let y=(Math.random()-0.5)*2000;

    pos[i*3]=x;
    pos[i*3+1]=y;
    target[i*3]=x;
    target[i*3+1]=y;

    color[i*3]=1;color[i*3+1]=1;color[i*3+2]=1;
}

geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
geo.setAttribute("aTarget",new THREE.BufferAttribute(target,3));
geo.setAttribute("color",new THREE.BufferAttribute(color,3));

const mat = new THREE.ShaderMaterial({
uniforms:{uProgress:{value:1}},
vertexShader:`
attribute vec3 aTarget;
attribute vec3 color;
uniform float uProgress;
varying vec3 vColor;

void main(){
vec3 p = mix(position,aTarget,uProgress);
vColor=color;
gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
gl_PointSize = 1.2;
}
`,
fragmentShader:`
varying vec3 vColor;
void main(){
float d=length(gl_PointCoord-vec2(0.5));
if(d>0.5) discard;
gl_FragColor=vec4(vColor,1.0);
}
`,
vertexColors:true
});

const points = new THREE.Points(geo,mat);
scene.add(points);

//////////////////// IMAGE LOAD ////////////////////

const paths=["1.jpg","2.jpg","3.jpg","4.jpg","5.jpg"];
const imgs=[];

paths.forEach((p,i)=>{
    const img=new Image();
    img.src=p;

    img.onload=()=>{
        console.log("loaded:",p);

        const c=document.createElement("canvas");
        const ctx=c.getContext("2d");

        c.width=img.width;
        c.height=img.height;
        ctx.drawImage(img,0,0);

        imgs[i]=ctx.getImageData(0,0,img.width,img.height);

        // auto show first image
        if(i===0) updateImage(0);
    };

    img.onerror=()=>console.error("FAILED:",p);
});

function updateImage(i){
if(!imgs[i]) return;

const img=imgs[i];
const data=img.data;
const w=img.width,h=img.height;

const t=geo.attributes.aTarget.array;
const c=geo.attributes.color.array;

for(let i=0;i<COUNT;i++){
let px=Math.floor(Math.random()*w);
let py=Math.floor(Math.random()*h);
let id=(py*w+px)*4;

t[i*3]=(px-w/2)*1.5;
t[i*3+1]=(h/2-py)*1.5;

c[i*3]=data[id]/255;
c[i*3+1]=data[id+1]/255;
c[i*3+2]=data[id+2]/255;
}

geo.attributes.aTarget.needsUpdate=true;
geo.attributes.color.needsUpdate=true;
mat.uniforms.uProgress.value=0;
}

//////////////////// ANIMATE ////////////////////

function animate(){
requestAnimationFrame(animate);

mat.uniforms.uProgress.value+=0.02;
if(mat.uniforms.uProgress.value>1) mat.uniforms.uProgress.value=1;

renderer.render(scene,camera);
}
animate();

//////////////////// HAND ////////////////////

const video=document.createElement("video");
const canvas=document.getElementById("output_canvas");
const ctx=canvas.getContext("2d");

canvas.width=220;
canvas.height=160;

let last=-1;

const hands=new Hands({
locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({maxNumHands:1});

hands.onResults(r=>{
ctx.drawImage(r.image,0,0,220,160);

let f=0;
if(r.multiHandLandmarks){
let lm=r.multiHandLandmarks[0];
if(lm[8].y<lm[6].y)f++;
if(lm[12].y<lm[10].y)f++;
if(lm[16].y<lm[14].y)f++;
if(lm[20].y<lm[18].y)f++;
if(lm[4].x<lm[3].x)f++;
}

if(f!==last){
last=f;
if(f===1) updateImage(0);
if(f===2) updateImage(1);
if(f===3) updateImage(2);
if(f===4) updateImage(3);
if(f===5) updateImage(4);
}
});

new Camera(video,{
onFrame:async()=>await hands.send({image:video}),
width:640,height:480
}).start();

</script>
</body>
</html>
