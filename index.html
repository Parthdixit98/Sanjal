<script>

//////////////////// GPU PARTICLES ////////////////////

const COUNT = 200000; // push higher if your GPU can handle

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    5000
);
camera.position.z = 900;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

//////////////////// BUFFERS ////////////////////

const geometry = new THREE.BufferGeometry();

const positions = new Float32Array(COUNT * 3);
const targets   = new Float32Array(COUNT * 3);
const colors    = new Float32Array(COUNT * 3);

for(let i=0;i<COUNT;i++){
    positions[i*3]   = (Math.random()-0.5)*2000;
    positions[i*3+1] = (Math.random()-0.5)*2000;
    positions[i*3+2] = 0;

    targets[i*3]   = positions[i*3];
    targets[i*3+1] = positions[i*3+1];
    targets[i*3+2] = 0;

    colors[i*3] = 1;
    colors[i*3+1] = 1;
    colors[i*3+2] = 1;
}

geometry.setAttribute("position", new THREE.BufferAttribute(positions,3));
geometry.setAttribute("aTarget", new THREE.BufferAttribute(targets,3));
geometry.setAttribute("color", new THREE.BufferAttribute(colors,3));

//////////////////// SHADER ////////////////////

const material = new THREE.ShaderMaterial({

    uniforms:{
        uProgress: { value: 0 }
    },

    vertexShader: `
        attribute vec3 aTarget;
        uniform float uProgress;
        varying vec3 vColor;

        void main(){
            vec3 newPos = mix(position, aTarget, uProgress);
            vColor = color;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos,1.0);
            gl_PointSize = 1.5;
        }
    `,

    fragmentShader: `
        varying vec3 vColor;

        void main(){
            float d = length(gl_PointCoord - vec2(0.5));
            if(d > 0.5) discard;

            gl_FragColor = vec4(vColor,1.0);
        }
    `,

    vertexColors:true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

//////////////////// TARGET UPDATE ////////////////////

function randomSpace(){
    const arr = geometry.attributes.aTarget.array;

    for(let i=0;i<COUNT;i++){
        arr[i*3]   = (Math.random()-0.5)*2500;
        arr[i*3+1] = (Math.random()-0.5)*2500;
        arr[i*3+2] = 0;
    }

    geometry.attributes.aTarget.needsUpdate = true;
    material.uniforms.uProgress.value = 0;
}

function updateToImage(imgData){

    if(!imgData) return;

    const data = imgData.data;
    const w = imgData.width;
    const h = imgData.height;

    const arr = geometry.attributes.aTarget.array;
    const col = geometry.attributes.color.array;

    const scale = 1.5;

    for(let i=0;i<COUNT;i++){
        const px = Math.floor(Math.random()*w);
        const py = Math.floor(Math.random()*h);

        const id = (py*w + px)*4;

        arr[i*3]   = (px - w/2)*scale;
        arr[i*3+1] = (h/2 - py)*scale;
        arr[i*3+2] = 0;

        col[i*3]   = data[id]/255;
        col[i*3+1] = data[id+1]/255;
        col[i*3+2] = data[id+2]/255;
    }

    geometry.attributes.aTarget.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;

    material.uniforms.uProgress.value = 0;
}

//////////////////// ANIMATION ////////////////////

function animate(){
    requestAnimationFrame(animate);

    material.uniforms.uProgress.value += 0.02;
    if(material.uniforms.uProgress.value > 1)
        material.uniforms.uProgress.value = 1;

    renderer.render(scene,camera);
}

animate();

</script>
